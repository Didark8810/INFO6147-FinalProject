<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Fruit Classifier + GradCAM</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="index.js"></script>
    <style>
        img {
            max-width: 500px;
            height: auto;
        }

        .img-container {
            max-width: 500px;
        }

        body {
            padding: 40px;
        }

        .btn-fixed {
            width: 180px;
        }

        .img-big {
            max-width: 100%;
            height: 500px;
            object-fit: contain;
        }
    </style>
</head>

<body class="bg-light" onload="init()">

    <div class="container text-center">
        <h1 class="mb-4">🍎 Fruit Classifier + GradCAM 🍌</h1>

        <div class="mb-3">
            <input type="file" class="form-control w-50 mx-auto" id="imageInput" accept="image/*">
        </div>

        <div class="d-flex justify-content-center gap-3 mb-4">
            <button class="btn btn-primary btn-fixed" onclick="uploadImage(event)">Clasificar Imagen</button>
            <button class="btn btn-success btn-fixed" onclick="uploadImageD(event)">Detectar Imagen</button>
            <button class="btn btn-warning btn-fixed" onclick="uploadImageA(event)">Video</button>
        </div>
        <div id="result"></div>
        <div id="resultDetect"></div>
    </div>
</body>

</html>
