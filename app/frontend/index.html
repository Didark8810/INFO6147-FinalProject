<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Fruit Classifier + GradCAM</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <script src="index.js"></script>
    <style>
        img {
            max-width: 500px;
            height: auto;
        }

        .img-container {
            max-width: 500px;
        }

        body {
            padding: 40px;
        }

        .btn-fixed {
            width: 180px;
        }

        .img-big {
            max-width: 100%;
            height: 500px;
            object-fit: contain;
        }
    </style>
</head>

<body class="bg-light" onload="init()">

    <div class="container text-center">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">🍎 Fruit Classifier + GradCAM 🍌</h1>
            <a href="https://github.com/Didark8810/INFO6147-FinalProject" target="_blank" class="btn btn-outline-dark d-flex align-items-center gap-2">
                <i class="bi bi-github fs-4"></i>
                <span>GitHub</span>
            </a>
        </div>
        <div class="mb-3">
            <input type="file" class="form-control w-50 mx-auto" id="imageInput" accept="image/*">
        </div>

        <div class="d-flex justify-content-center gap-3 mb-4">
            <button class="btn btn-info btn-fixed" onclick="uploadImageB()">Clasificar Basico</button>
            <button class="btn btn-primary btn-fixed" onclick="uploadImage()">Clasificar Imagen</button>
            <button class="btn btn-success btn-fixed" onclick="uploadImageD()">Detectar Imagen</button>
            <button class="btn btn-warning btn-fixed" onclick="Video()">Video</button>
        </div>
        <div id="result"></div>
    </div>
</body>

</html>
